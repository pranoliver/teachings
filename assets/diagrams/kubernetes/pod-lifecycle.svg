<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Pod with shared network and volumes</title>
  <desc id="desc">A Kubernetes pod containing two containers that share an IP address and mounted volumes.</desc>
  <defs>
    <style>
      text { font-family: 'Outfit', system-ui, sans-serif; }
      .label { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .note { font-size: 13px; fill: #656d76; }
      .box { rx: 12; }
    </style>
  </defs>
  <rect width="720" height="360" fill="#f6f8fa" />

  <g transform="translate(80, 40)">
    <rect x="0" y="0" width="560" height="280" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
    <text x="24" y="32" class="label">Pod</text>
    <text x="24" y="55" class="note">Shared IP, namespace, and volumes</text>

    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="220" height="90" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="8" />
      <text x="110" y="32" text-anchor="middle" class="label" font-size="14">Container: app</text>
      <text x="110" y="58" text-anchor="middle" class="note">Main application</text>
      <text x="110" y="76" text-anchor="middle" class="note">Port 80</text>
    </g>

    <g transform="translate(300, 80)">
      <rect x="0" y="0" width="220" height="90" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="8" />
      <text x="110" y="32" text-anchor="middle" class="label" font-size="14">Container: sidecar</text>
      <text x="110" y="58" text-anchor="middle" class="note">Log forwarder / proxy</text>
      <text x="110" y="76" text-anchor="middle" class="note">Shares logs volume</text>
    </g>

    <g transform="translate(120, 200)">
      <rect x="0" y="0" width="320" height="50" fill="#fff3e0" stroke="#ef6c00" stroke-width="1" rx="8" />
      <text x="160" y="30" text-anchor="middle" class="note">sharedVolume (emptyDir)</text>
    </g>
  </g>

  <g transform="translate(300, 320)">
    <text x="60" y="0" text-anchor="middle" class="note">10.244.1.5</text>
  </g>
</svg>