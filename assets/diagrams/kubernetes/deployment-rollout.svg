<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Deployment rolling update</title>
  <desc id="desc">A Deployment gradually replaces old pods with new pods during a rolling update.</desc>
  <defs>
    <style>
      text { font-family: 'Outfit', system-ui, sans-serif; }
      .label { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .note { font-size: 13px; fill: #656d76; }
      .box { rx: 8; }
    </style>
  </defs>
  <rect width="720" height="320" fill="#f6f8fa" />

  <g transform="translate(40, 40)">
    <text x="0" y="0" class="label">Rolling update: v1 → v2</text>
    <text x="0" y="24" class="note">Deployment replaces pods one by one so traffic keeps flowing.</text>
  </g>

  <g transform="translate(40, 100)">
    <text x="0" y="0" class="note">Before update</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v1</text>
    </g>
    <g transform="translate(60, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v1</text>
    </g>
    <g transform="translate(120, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v1</text>
    </g>
  </g>

  <g transform="translate(320, 100)">
    <text x="0" y="0" class="note">During update</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v1</text>
    </g>
    <g transform="translate(60, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e8f0fe" stroke="#326ce5" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v1</text>
    </g>
    <g transform="translate(120, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e6f4ea" stroke="#34a853" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v2</text>
    </g>
  </g>

  <g transform="translate(560, 100)">
    <text x="0" y="0" class="note">After update</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e6f4ea" stroke="#34a853" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v2</text>
    </g>
    <g transform="translate(60, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e6f4ea" stroke="#34a853" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v2</text>
    </g>
    <g transform="translate(120, 15)">
      <rect x="0" y="0" width="50" height="50" fill="#e6f4ea" stroke="#34a853" stroke-width="2" class="box" />
      <text x="25" y="30" text-anchor="middle" class="label" font-size="12">v2</text>
    </g>
  </g>

  <g stroke="#656d76" stroke-width="2" marker-end="url(#arrow)" opacity="0.4">
    <line x1="210" y1="140" x2="310" y2="140" />
    <line x1="480" y1="140" x2="550" y2="140" />
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76" />
    </marker>
  </defs>
</svg>