<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" aria-label="Diagram showing tables connected by foreign keys" role="img"><title>Diagram showing tables connected by foreign keys</title>
              <rect x="30" y="40" width="170" height="140" rx="10" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="115" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#336791">customers</text>
              <text x="115" y="100" text-anchor="middle" font-size="11" fill="#656d76">id, name, email...</text>

              <path d="M200 100 L 270 100" stroke="#d0d7de" stroke-width="2" marker-end="url(#sqldatabases-arrow)"/>
              <text x="235" y="90" text-anchor="middle" font-size="11" fill="#656d76">places</text>

              <rect x="280" y="40" width="170" height="140" rx="10" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="365" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#336791">orders</text>
              <text x="365" y="100" text-anchor="middle" font-size="11" fill="#656d76">id, customer_id, total...</text>

              <path d="M450 100 L 520 100" stroke="#d0d7de" stroke-width="2" marker-end="url(#sqldatabases-arrow)"/>
              <text x="485" y="90" text-anchor="middle" font-size="11" fill="#656d76">contains</text>

              <rect x="530" y="40" width="170" height="140" rx="10" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="615" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#336791">order_items</text>
              <text x="615" y="100" text-anchor="middle" font-size="11" fill="#656d76">id, order_id, product_id...</text>

              <defs>
                <marker id="sqldatabases-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0d7de"/></marker>
              </defs>
            </svg>