<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" aria-label="ERD for online store database" role="img"><title>ERD for online store database</title>
              <rect x="30" y="30" width="150" height="80" rx="8" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="105" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#336791">customers</text>
              <text x="105" y="80" text-anchor="middle" font-size="10" fill="#656d76">PK: id</text>

              <rect x="30" y="190" width="150" height="80" rx="8" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="105" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#336791">products</text>
              <text x="105" y="240" text-anchor="middle" font-size="10" fill="#656d76">PK: id | FK: category_id</text>

              <rect x="285" y="190" width="150" height="80" rx="8" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="360" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#336791">categories</text>
              <text x="360" y="240" text-anchor="middle" font-size="10" fill="#656d76">PK: id</text>

              <rect x="285" y="30" width="150" height="80" rx="8" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="360" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#336791">orders</text>
              <text x="360" y="80" text-anchor="middle" font-size="10" fill="#656d76">PK: id | FK: customer_id</text>

              <rect x="540" y="30" width="150" height="80" rx="8" fill="#336791" fill-opacity="0.15" stroke="#336791" stroke-width="2"/>
              <text x="615" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#336791">order_items</text>
              <text x="615" y="80" text-anchor="middle" font-size="10" fill="#656d76">PK: id | FK: order_id, product_id</text>

              <path d="M180 70 L 285 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#sqldatabases-arrow)"/>
              <path d="M435 70 L 540 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#sqldatabases-arrow)"/>
              <path d="M180 230 L 285 230" stroke="#d0d7de" stroke-width="2" marker-end="url(#sqldatabases-arrow)"/>

              <defs>
                <marker id="sqldatabases-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0d7de"/></marker>
              </defs>
            </svg>