<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" aria-label="Diagram showing client request to event loop to worker threads" role="img"><title>Diagram showing client request to event loop to worker threads</title>
              <rect x="30" y="30" width="120" height="80" rx="10" fill="#339933" fill-opacity="0.15" stroke="#339933" stroke-width="2"/>
              <text x="90" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#339933">Client</text>
              <text x="90" y="85" text-anchor="middle" font-size="10" fill="#656d76">HTTP request</text>

              <path d="M150 70 L 240 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#nodejsexpress-arrow)"/>

              <rect x="260" y="30" width="200" height="80" rx="10" fill="#339933" fill-opacity="0.15" stroke="#339933" stroke-width="2"/>
              <text x="360" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#339933">Event Loop</text>
              <text x="360" y="85" text-anchor="middle" font-size="11" fill="#656d76">non-blocking I/O</text>

              <path d="M460 70 L 550 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#nodejsexpress-arrow)"/>

              <rect x="570" y="30" width="120" height="80" rx="10" fill="#339933" fill-opacity="0.15" stroke="#339933" stroke-width="2"/>
              <text x="630" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#339933">Response</text>
              <text x="630" y="85" text-anchor="middle" font-size="10" fill="#656d76">JSON / HTML</text>

              <defs>
                <marker id="nodejsexpress-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0d7de"/></marker>
              </defs>
            </svg>