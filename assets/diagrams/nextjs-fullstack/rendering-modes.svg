  <text x="360.0" y="322.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">Browser</text>    <marker id="arr-33559" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
