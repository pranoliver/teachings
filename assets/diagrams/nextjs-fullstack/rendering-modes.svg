<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram comparing SSR, SSG, and ISR rendering modes in Next.js</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2328">Next.js Rendering Modes</text>  <rect x="40" y="70" width="200" height="100" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="140.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">SSR</text>
  <text x="140.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">Server-Side Rendering</text>  <text x="140" y="150" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#6b7280">Request → Server renders HTML</text>  <rect x="260" y="70" width="200" height="100" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="360.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">SSG</text>
  <text x="360.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">Static Site Generation</text>  <text x="360" y="150" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#6b7280">Build time → Static HTML served</text>  <rect x="480" y="70" width="200" height="100" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="580.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">ISR</text>
  <text x="580.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">Incremental Static Regeneration</text>  <text x="580" y="150" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#6b7280">Static first, then revalidate</text>  <rect x="200" y="210" width="320" height="60" rx="10" fill="#000000" stroke="#000000" stroke-width="1.5"/>
