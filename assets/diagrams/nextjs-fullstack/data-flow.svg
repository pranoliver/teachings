<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram showing Next.js data flow between browser, server, and database</title>
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2328">Next.js Data Flow</text>  <rect x="60" y="80" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="135.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">Browser</text>  <rect x="285" y="80" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="360.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">Next.js Server</text>  <rect x="510" y="80" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#000000" stroke-width="1.5"/>
  <text x="585.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">Database</text>    <marker id="arr-13120" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000"/>
    </marker>
  <line x1="210" y1="115" x2="285" y2="115" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-13120)" stroke-linecap="round"/>
  <text x="247.5" y="103.0" text-anchor="middle" font-size="10" fill="#848d97">request</text>    <marker id="arr-86097" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000"/>
    </marker>
  <line x1="435" y1="115" x2="510" y2="115" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-86097)" stroke-linecap="round"/>
  <text x="472.5" y="103.0" text-anchor="middle" font-size="10" fill="#848d97">SQL/query</text>    <marker id="arr-93156" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000"/>
    </marker>
  <line x1="510" y1="150" x2="435" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-93156)" stroke-linecap="round"/>
  <text x="472.5" y="138.0" text-anchor="middle" font-size="10" fill="#848d97">data</text>    <marker id="arr-43983" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000"/>
    </marker>
  <line x1="285" y1="150" x2="210" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-43983)" stroke-linecap="round"/>
  <text x="247.5" y="138.0" text-anchor="middle" font-size="10" fill="#848d97">HTML+JSON</text>  <rect x="285" y="200" width="150" height="60" rx="10" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <text x="360.0" y="224.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#ffffff">Hydration</text>
  <text x="360.0" y="244.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">React takes over</text>    <marker id="arr-16359" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000"/>
    </marker>
  <line x1="135" y1="150" x2="285" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arr-16359)" stroke-linecap="round"/>  <text x="360" y="300" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">server renders first, then React hydrates for interactivity</text></svg>
