<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram of Next.js file-based routing for pages and API routes</title>
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2328">Next.js File-Based Routing</text>  <rect x="80" y="75" width="240" height="220" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="185.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#000000">app/ or pages/</text>  <rect x="110" y="105" width="180" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="118.0" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#000000">page.tsx</text>  <text x="360" y="118" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">→ /</text>  <rect x="110" y="140" width="180" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="153.0" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#000000">about/page.tsx</text>  <text x="360" y="153" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">→ /about</text>  <rect x="110" y="175" width="180" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="188.0" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#000000">blog/[slug]/page.tsx</text>  <text x="360" y="188" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">→ /blog/[slug]</text>  <rect x="110" y="210" width="180" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="223.0" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#000000">api/posts/route.ts</text>  <text x="360" y="223" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">→ /api/posts</text>  <rect x="110" y="245" width="180" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200.0" y="258.0" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#000000">layout.tsx</text>  <text x="360" y="258" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#6b7280">→ /layout</text></svg>
