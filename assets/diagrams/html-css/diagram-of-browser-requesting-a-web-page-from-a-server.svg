<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" aria-label="Diagram of browser requesting a web page from a server" role="img"><title>Diagram of browser requesting a web page from a server</title>
              <!-- Background card -->
              <rect x="15" y="15" width="690" height="170" rx="20" fill="rgba(47,129,247,0.04)" stroke="#d0d7de" stroke-width="1"/>

              <!-- Browser -->
              <rect x="45" y="40" width="140" height="110" rx="14" fill="#f6f8fa" stroke="#e34c26" stroke-width="3"/>
              <rect x="60" y="55" width="110" height="75" rx="6" fill="#ddf4ff" stroke="#e34c26" stroke-width="2"/>
              <line x1="70" y1="78" x2="160" y2="78" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
              <line x1="70" y1="93" x2="140" y2="93" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
              <line x1="70" y1="108" x2="120" y2="108" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
              <text x="115" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Browser</text>

              <!-- Request arrow -->
              <path d="M195 100 L 275 100" stroke="#3fb950" stroke-width="3" marker-end="url(#htmlcss-arrow)" class="flow-line"/>
              <rect x="205" y="72" width="60" height="22" rx="11" fill="#dafbe1" stroke="#3fb950" stroke-width="1"/>
              <text x="235" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">GET</text>

              <!-- Server -->
              <rect x="305" y="40" width="140" height="110" rx="14" fill="#f6f8fa" stroke="#a371f7" stroke-width="3"/>
              <rect x="325" y="55" width="100" height="75" rx="8" fill="#f5f0ff" stroke="#a371f7" stroke-width="2"/>
              <circle cx="345" cy="75" r="5" fill="#a371f7"/>
              <circle cx="345" cy="100" r="5" fill="#a371f7"/>
              <line x1="360" y1="75" x2="415" y2="75" stroke="#a371f7" stroke-width="2" stroke-linecap="round"/>
              <line x1="360" y1="100" x2="415" y2="100" stroke="#a371f7" stroke-width="2" stroke-linecap="round"/>
              <text x="375" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Server</text>

              <!-- Response arrow -->
              <path d="M455 120 L 535 120" stroke="#a371f7" stroke-width="3" marker-end="url(#htmlcss-arrow2)" class="flow-line"/>
              <rect x="465" y="130" width="60" height="22" rx="11" fill="#f5f0ff" stroke="#a371f7" stroke-width="1"/>
              <text x="495" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#8957e5">HTML/CSS</text>

              <!-- Browser renders -->
              <rect x="565" y="40" width="140" height="110" rx="14" fill="#f6f8fa" stroke="#e34c26" stroke-width="3"/>
              <rect x="580" y="55" width="110" height="75" rx="6" fill="#ddf4ff" stroke="#e34c26" stroke-width="2"/>
              <rect x="595" y="70" width="80" height="45" rx="4" fill="white" stroke="#e34c26" stroke-width="1"/>
              <line x1="605" y1="83" x2="665" y2="83" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
              <line x1="605" y1="96" x2="655" y2="96" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
              <text x="635" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Renders</text>

              <defs>
                <marker id="htmlcss-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker>
                <marker id="htmlcss-arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
              </defs>
            </svg>