<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" aria-label="Diagram showing HTML document structure" role="img"><title>Diagram showing HTML document structure</title>
              <!-- doctype -->
              <rect x="80" y="20" width="560" height="40" rx="8" fill="#ddf4ff" stroke="#e34c26" stroke-width="2"/>
              <text x="360" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#e34c26">&lt;!DOCTYPE html&gt;</text>

              <!-- html wrapper -->
              <rect x="80" y="70" width="560" height="210" rx="12" fill="rgba(163,113,247,0.08)" stroke="#a371f7" stroke-width="2"/>
              <text x="360" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#a371f7">&lt;html&gt; wrapper &lt;/html&gt;</text>

              <!-- head -->
              <rect x="110" y="110" width="230" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
              <rect x="130" y="125" width="190" height="40" rx="6" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="225" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">&lt;head&gt;</text>
              <text x="225" y="198" text-anchor="middle" font-size="12" fill="#656d76">metadata &amp; links</text>

              <!-- body -->
              <rect x="360" y="110" width="250" height="150" rx="10" fill="#fff8c5" stroke="#d29922" stroke-width="2"/>
              <text x="485" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">&lt;body&gt;</text>

              <rect x="380" y="155" width="210" height="30" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
              <text x="485" y="174" text-anchor="middle" font-size="12" fill="#656d76">headings &amp; paragraphs</text>

              <rect x="380" y="190" width="210" height="30" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
              <text x="485" y="209" text-anchor="middle" font-size="12" fill="#656d76">images, links, forms</text>

              <text x="485" y="245" text-anchor="middle" font-size="12" fill="#9a6700" font-weight="600">visible content</text>
            </svg>