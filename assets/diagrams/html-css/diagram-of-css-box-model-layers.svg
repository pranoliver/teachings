<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" aria-label="Diagram of CSS box model layers" role="img"><title>Diagram of CSS box model layers</title>
              <!-- Margin -->
              <rect x="60" y="30" width="600" height="240" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6"/>
              <text x="360" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#656d76">margin</text>

              <!-- Border -->
              <rect x="110" y="75" width="500" height="170" rx="12" fill="#fff8c5" stroke="#d29922" stroke-width="4"/>
              <text x="360" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">border</text>

              <!-- Padding -->
              <rect x="150" y="115" width="420" height="120" rx="8" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="360" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">padding</text>

              <!-- Content -->
              <rect x="190" y="155" width="340" height="60" rx="6" fill="#ddf4ff" stroke="#e34c26" stroke-width="2"/>
              <text x="360" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#e34c26">content</text>
            </svg>