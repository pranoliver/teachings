<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" class="diagram" role="img" aria-label="Global cloud infrastructure diagram">
  <defs>
    <marker id="carr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#f6f8fa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Global Cloud Infrastructure</text>
  <!-- Global services -->
  <rect x="250" y="50" width="300" height="50" rx="8" fill="#f97316" opacity="0.2" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Global services: DNS, CDN, IAM</text>
  <line x1="400" y1="100" x2="400" y2="130" stroke="#f97316" stroke-width="2" marker-end="url(#carr)"/>
  <!-- Regions -->
  <rect x="80" y="135" width="200" height="70" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="180" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Region A</text>
  <text x="180" y="185" text-anchor="middle" font-size="12" fill="#656d76">us-east-1 / westeurope</text>
  <rect x="300" y="135" width="200" height="70" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Region B</text>
  <text x="400" y="185" text-anchor="middle" font-size="12" fill="#656d76">us-west-2 / northeurope</text>
  <rect x="520" y="135" width="200" height="70" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="620" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Region C</text>
  <text x="620" y="185" text-anchor="middle" font-size="12" fill="#656d76">ap-south-1 / asia-east1</text>
  <!-- AZs -->
  <rect x="110" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="135" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-1</text>
  <rect x="180" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="205" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-2</text>
  <line x1="180" y1="205" x2="145" y2="220" stroke="#059669" stroke-width="1"/>
  <line x1="180" y1="205" x2="205" y2="220" stroke="#059669" stroke-width="1"/>
  <rect x="340" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="365" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-1</text>
  <rect x="410" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="435" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-2</text>
  <line x1="400" y1="205" x2="365" y2="220" stroke="#059669" stroke-width="1"/>
  <line x1="400" y1="205" x2="435" y2="220" stroke="#059669" stroke-width="1"/>
  <rect x="560" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="585" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-1</text>
  <rect x="630" y="220" width="50" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="655" y="245" text-anchor="middle" font-size="12" fill="#1f2328">AZ-2</text>
  <line x1="620" y1="205" x2="585" y2="220" stroke="#059669" stroke-width="1"/>
  <line x1="620" y1="205" x2="655" y2="220" stroke="#059669" stroke-width="1"/>
  <!-- Edge locations -->
  <circle cx="120" cy="290" r="8" fill="#7c3aed" opacity="0.5"/>
  <circle cx="250" cy="290" r="8" fill="#7c3aed" opacity="0.5"/>
  <circle cx="400" cy="290" r="8" fill="#7c3aed" opacity="0.5"/>
  <circle cx="550" cy="290" r="8" fill="#7c3aed" opacity="0.5"/>
  <circle cx="680" cy="290" r="8" fill="#7c3aed" opacity="0.5"/>
  <text x="400" y="310" text-anchor="middle" font-size="12" fill="#656d76">Edge locations cache content close to users.</text>
</svg>
