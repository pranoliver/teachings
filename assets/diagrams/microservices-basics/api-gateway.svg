<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" style="font-family: Outfit, system-ui, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <title>Diagram of an API gateway routing traffic to multiple microservices with cross-cutting concerns</title>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <defs>
    <marker id="gw-gw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">API Gateway: One Entry Point, Many Concerns</text>  <rect x="40" y="105" width="100" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="90.0" y="140.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">Client</text>
  <text x="90.0" y="156.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">mobile / web</text>  <rect x="180" y="75" width="140" height="130" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
  <text x="250.0" y="140.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#059669">API Gateway</text>  <rect x="200" y="105" width="100" height="18" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">auth / JWT</text>  <rect x="200" y="127" width="100" height="18" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250.0" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">rate limit</text>  <rect x="200" y="149" width="100" height="18" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250.0" y="158.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">SSL / TLS</text>  <rect x="200" y="171" width="100" height="18" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250.0" y="180.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">routing</text>  <rect x="360" y="60" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="410.0" y="82.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Orders</text>  <rect x="360" y="120" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="410.0" y="142.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Payments</text>  <rect x="360" y="180" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="410.0" y="202.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Users</text>  <rect x="490" y="90" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="540.0" y="112.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Inventory</text>  <rect x="490" y="150" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="540.0" y="172.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Shipping</text>  <rect x="620" y="120" width="100" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="670.0" y="142.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Notifications</text>    <marker id="arr-4265" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="140" y1="140" x2="180" y2="140" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-4265)" stroke-linecap="round"/>
  <text x="160.0" y="130.0" text-anchor="middle" font-size="10" fill="#848d97">/api/v1/*</text>    <marker id="arr-8948" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="320" y1="82" x2="360" y2="82" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-8948)" stroke-linecap="round"/>
  <text x="340.0" y="72.0" text-anchor="middle" font-size="10" fill="#848d97">/orders</text>    <marker id="arr-338" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="320" y1="122" x2="360" y2="142" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-338)" stroke-linecap="round"/>
  <text x="340.0" y="122.0" text-anchor="middle" font-size="10" fill="#848d97">/payments</text>    <marker id="arr-33093" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="320" y1="162" x2="360" y2="202" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-33093)" stroke-linecap="round"/>
  <text x="340.0" y="172.0" text-anchor="middle" font-size="10" fill="#848d97">/users</text>    <marker id="arr-61738" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="460" y1="112" x2="490" y2="112" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-61738)" stroke-linecap="round"/>    <marker id="arr-62454" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="590" y1="172" x2="620" y2="142" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-62454)" stroke-linecap="round"/>  <text x="360" y="270" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#1a7f37">cross-cutting concerns live at the edge; services stay focused on business logic</text></svg>
