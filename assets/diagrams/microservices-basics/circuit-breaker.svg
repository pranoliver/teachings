<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" style="font-family: Outfit, system-ui, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <title>Diagram of a circuit breaker protecting calls from a failing downstream service</title>
  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>
  <defs>
    <marker id="cb-ok" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
    <marker id="cb-fail" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cf222e"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Circuit Breaker: Fail Fast, Fail Safe</text>  <rect x="60" y="95" width="130" height="70" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="125.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Order Service</text>
  <text x="125.0" y="146.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">caller</text>  <rect x="240" y="85" width="150" height="90" rx="10" fill="#fdf8ec" stroke="#9a6700" stroke-width="1.5"/>
  <text x="315.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#9a6700">Circuit Breaker</text>
  <text x="315.0" y="146.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">closed → open → half-open</text>  <rect x="450" y="95" width="150" height="70" rx="10" fill="#fdecec" stroke="#cf222e" stroke-width="1.5"/>
  <text x="525.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#cf222e">Payment Service</text>
  <text x="525.0" y="146.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">down / slow</text>    <marker id="arr-26360" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="190" y1="130" x2="240" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-26360)" stroke-linecap="round"/>
  <text x="215.0" y="120.0" text-anchor="middle" font-size="10" fill="#848d97">request</text>    <marker id="arr-66360" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="390" y1="130" x2="450" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-66360)" stroke-linecap="round"/>  <path d="M315 175 Q 315 225 125 225 L 125 168" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#cb-fail)" stroke-linecap="round"/>
  <text x="360" y="215" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#cf222e">return fallback instantly, skip failed call</text>  <text x="360" y="245" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#1a7f37">protects the caller from cascading failures and gives downstream time to recover</text></svg>
