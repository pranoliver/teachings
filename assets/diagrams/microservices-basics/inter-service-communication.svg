<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" style="font-family: Outfit, system-ui, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <title>Diagram showing synchronous REST calls and asynchronous event messaging between microservices</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="sync-sync" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
    <marker id="async-async" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Synchronous vs Asynchronous Service Communication</text>  <text x="360" y="58" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1f2328">Synchronous: REST / gRPC / GraphQL</text>  <rect x="60" y="80" width="110" height="55" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
  <text x="115.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#059669">API Gateway</text>
  <text x="115.0" y="123.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">routes calls</text>  <rect x="210" y="80" width="90" height="55" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
  <text x="255.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#059669">Orders</text>
  <text x="255.0" y="123.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">200 / 500</text>  <rect x="330" y="80" width="100" height="55" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
  <text x="380.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#059669">Inventory</text>
  <text x="380.0" y="123.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">blocks</text>  <rect x="470" y="80" width="90" height="55" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
  <text x="515.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#059669">Users</text>
  <text x="515.0" y="123.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">auth</text>    <marker id="arr-53314" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="170" y1="107" x2="210" y2="107" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-53314)" stroke-linecap="round"/>
  <text x="190.0" y="97.0" text-anchor="middle" font-size="10" fill="#848d97">GET /orders</text>    <marker id="arr-19337" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="300" y1="107" x2="330" y2="107" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-19337)" stroke-linecap="round"/>
  <text x="315.0" y="97.0" text-anchor="middle" font-size="10" fill="#848d97">reserve</text>    <marker id="arr-72152" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#059669"/>
    </marker>
  <line x1="430" y1="107" x2="470" y2="107" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-72152)" stroke-linecap="round"/>
  <text x="450.0" y="97.0" text-anchor="middle" font-size="10" fill="#848d97">verify</text>  <text x="360" y="155" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#9a6700">fast, but failure chains and blocking can cascade</text>  <line x1="40" y1="170" x2="680" y2="170" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="198" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1f2328">Asynchronous: Message Broker / Event Bus</text>  <rect x="60" y="225" width="110" height="55" rx="10" fill="#f0ebfb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115.0" y="252.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Orders</text>
  <text x="115.0" y="268.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">publishes</text>  <rect x="275" y="220" width="140" height="70" rx="10" fill="#f6f8fa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="345.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Message Broker</text>
  <text x="345.0" y="271.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">Kafka / RabbitMQ</text>  <rect x="475" y="225" width="110" height="55" rx="10" fill="#f0ebfb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="530.0" y="252.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Payments</text>
  <text x="530.0" y="268.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">consumes</text>  <rect x="475" y="295" width="110" height="45" rx="10" fill="#f0ebfb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="530.0" y="317.5" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Shipping</text>    <marker id="arr-75115" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  <line x1="170" y1="252" x2="275" y2="252" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-75115)" stroke-linecap="round"/>
  <text x="222.5" y="242.0" text-anchor="middle" font-size="10" fill="#848d97">OrderPlaced</text>    <marker id="arr-32607" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  <line x1="415" y1="252" x2="475" y2="252" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-32607)" stroke-linecap="round"/>
  <text x="445.0" y="242.0" text-anchor="middle" font-size="10" fill="#848d97">charge</text>    <marker id="arr-42686" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  <line x1="415" y1="270" x2="475" y2="310" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-42686)" stroke-linecap="round"/>
  <text x="445.0" y="280.0" text-anchor="middle" font-size="10" fill="#848d97">label</text>  <text x="360" y="340" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#1a7f37">loose coupling, buffering, and independent scaling</text></svg>
