<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" style="font-family: Outfit, system-ui, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <title>Diagram of a saga pattern with compensating transactions across order, payment, and inventory services</title>
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
  <defs>
    <marker id="saga-fwd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="saga-back" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cf222e"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Saga Pattern: Compensating Transactions on Failure</text>  <rect x="70" y="75" width="140" height="60" rx="10" fill="#f0ebfb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Order Service</text>
  <text x="140.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">created ✓</text>  <rect x="290" y="75" width="150" height="60" rx="10" fill="#f0ebfb" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="365.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#7c3aed">Payment Service</text>
  <text x="365.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">charged ✓</text>  <rect x="520" y="75" width="150" height="60" rx="10" fill="#fdecec" stroke="#cf222e" stroke-width="1.5"/>
  <text x="595.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#cf222e">Inventory Service</text>
  <text x="595.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">stock low ✗</text>    <marker id="arr-5092" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  <line x1="210" y1="105" x2="290" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-5092)" stroke-linecap="round"/>
  <text x="250.0" y="95.0" text-anchor="middle" font-size="10" fill="#848d97">OrderPlaced</text>    <marker id="arr-86705" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  <line x1="440" y1="105" x2="520" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-86705)" stroke-linecap="round"/>
  <text x="480.0" y="95.0" text-anchor="middle" font-size="10" fill="#848d97">PaymentProcessed</text>  <path d="M520 120 L 440 120" stroke="#cf222e" stroke-width="2" marker-end="url(#saga-back)" stroke-linecap="round"/>
  <path d="M290 120 L 210 120" stroke="#cf222e" stroke-width="2" marker-end="url(#saga-back)" stroke-linecap="round"/>
  <text x="480" y="145" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#cf222e">RefundPayment (compensate)</text>  <text x="250" y="145" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#cf222e">CancelOrder (compensate)</text>  <rect x="60" y="185" width="600" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>  <text x="360" y="210" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1f2328">Final state: order cancelled, payment refunded, inventory unchanged</text>  <text x="360" y="235" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#656d76">Sagas replace distributed SQL transactions with local steps + compensations</text></svg>
