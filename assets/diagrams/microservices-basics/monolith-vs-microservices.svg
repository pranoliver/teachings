<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" style="font-family: Outfit, system-ui, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <title>Diagram comparing a monolithic application with a microservices architecture</title>
  <rect x="0" y="0" width="720" height="240" fill="#ffffff"/>
  <defs>
    <marker id="mono-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#656d76"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Monolith vs Microservices</text>  <rect x="80" y="55" width="200" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180.0" y="120.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">Single Deployable</text>  <rect x="105" y="105" width="60" height="36" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135.0" y="123.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">API</text>  <rect x="175" y="105" width="60" height="36" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="205.0" y="123.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">Auth</text>  <rect x="245" y="105" width="60" height="36" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="275.0" y="123.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">DB</text>  <rect x="150" y="175" width="170" height="36" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="235.0" y="193.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#656d76">Shared Database</text>  <line x1="135" y1="141" x2="135" y2="175" stroke="#d0d7de" stroke-width="1.5"/>  <line x1="205" y1="141" x2="205" y2="175" stroke="#d0d7de" stroke-width="1.5"/>  <line x1="275" y1="141" x2="275" y2="175" stroke="#d0d7de" stroke-width="1.5"/>  <line x1="360" y1="45" x2="360" y2="205" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="410" y="60" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="450.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Orders</text>  <rect x="505" y="60" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="545.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Payments</text>  <rect x="600" y="60" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="640.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Users</text>  <rect x="410" y="125" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="450.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Inventory</text>  <rect x="505" y="125" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="545.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Shipping</text>  <rect x="600" y="125" width="80" height="50" rx="8" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="640.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#486bb3">Notifications</text>    <marker id="arr-48112" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#486bb3"/>
    </marker>
  <line x1="490" y1="85" x2="505" y2="85" stroke="#486bb3" stroke-width="1.5" marker-end="url(#arr-48112)" stroke-linecap="round"/>    <marker id="arr-18800" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#486bb3"/>
    </marker>
  <line x1="585" y1="85" x2="600" y2="85" stroke="#486bb3" stroke-width="1.5" marker-end="url(#arr-18800)" stroke-linecap="round"/>    <marker id="arr-50951" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#486bb3"/>
    </marker>
  <line x1="450" y1="110" x2="450" y2="125" stroke="#486bb3" stroke-width="1.5" marker-end="url(#arr-50951)" stroke-linecap="round"/>    <marker id="arr-39718" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#486bb3"/>
    </marker>
  <line x1="545" y1="110" x2="545" y2="125" stroke="#486bb3" stroke-width="1.5" marker-end="url(#arr-39718)" stroke-linecap="round"/>    <marker id="arr-46904" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#486bb3"/>
    </marker>
  <line x1="640" y1="110" x2="640" y2="125" stroke="#486bb3" stroke-width="1.5" marker-end="url(#arr-46904)" stroke-linecap="round"/>  <text x="180" y="220" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#848d97">all code deployed together</text>  <text x="540" y="220" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#848d97">independent services with own data and teams</text></svg>
