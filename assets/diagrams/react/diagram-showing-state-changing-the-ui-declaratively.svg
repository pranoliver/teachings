<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" aria-label="Diagram showing state changing the UI declaratively" role="img"><title>Diagram showing state changing the UI declaratively</title>
              <rect x="30" y="35" width="120" height="70" rx="10" fill="#61DAFB" fill-opacity="0.15" stroke="#61DAFB" stroke-width="2"/>
              <text x="90" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#20232a">State</text>

              <path d="M150 70 L 240 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#react-arrow)"/>
              <text x="195" y="60" text-anchor="middle" font-size="11" fill="#656d76">describes</text>

              <rect x="260" y="35" width="200" height="70" rx="10" fill="#20232a" fill-opacity="0.15" stroke="#61DAFB" stroke-width="2"/>
              <text x="360" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#61DAFB">React Component</text>
              <text x="360" y="88" text-anchor="middle" font-size="11" fill="#ffffff">function of state</text>

              <path d="M460 70 L 550 70" stroke="#d0d7de" stroke-width="2" marker-end="url(#react-arrow)"/>
              <text x="505" y="60" text-anchor="middle" font-size="11" fill="#656d76">renders</text>

              <rect x="570" y="35" width="120" height="70" rx="10" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
              <text x="630" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">UI</text>

              <defs>
                <marker id="react-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0d7de"/></marker>
              </defs>
            </svg>