<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" aria-label="Diagram showing HTML document tree" role="img"><title>Diagram showing HTML document tree</title>
              <!-- document -->
              <rect x="310" y="20" width="100" height="40" rx="8" fill="#f7df1e" stroke="#d29922" stroke-width="2"/>
              <text x="360" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#323330">document</text>

              <line x1="360" y1="60" x2="360" y2="90" stroke="#d0d7de" stroke-width="2"/>

              <!-- html -->
              <rect x="310" y="90" width="100" height="40" rx="8" fill="#ddf4ff" stroke="#f7df1e" stroke-width="2"/>
              <text x="360" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#f7df1e">&lt;html&gt;</text>

              <line x1="360" y1="130" x2="360" y2="150" stroke="#d0d7de" stroke-width="2"/>
              <line x1="200" y1="150" x2="520" y2="150" stroke="#d0d7de" stroke-width="2"/>
              <line x1="200" y1="150" x2="200" y2="170" stroke="#d0d7de" stroke-width="2"/>
              <line x1="520" y1="150" x2="520" y2="170" stroke="#d0d7de" stroke-width="2"/>

              <!-- head -->
              <rect x="150" y="170" width="100" height="40" rx="8" fill="#f5f0ff" stroke="#a371f7" stroke-width="2"/>
              <text x="200" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#a371f7">&lt;head&gt;</text>

              <!-- body -->
              <rect x="470" y="170" width="100" height="40" rx="8" fill="#f5f0ff" stroke="#a371f7" stroke-width="2"/>
              <text x="520" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#a371f7">&lt;body&gt;</text>

              <line x1="520" y1="210" x2="520" y2="230" stroke="#d0d7de" stroke-width="2"/>
              <line x1="420" y1="230" x2="620" y2="230" stroke="#d0d7de" stroke-width="2"/>
              <line x1="420" y1="230" x2="420" y2="250" stroke="#d0d7de" stroke-width="2"/>
              <line x1="520" y1="230" x2="520" y2="250" stroke="#d0d7de" stroke-width="2"/>
              <line x1="620" y1="230" x2="620" y2="250" stroke="#d0d7de" stroke-width="2"/>

              <!-- h1, p, button -->
              <rect x="370" y="250" width="80" height="30" rx="6" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="410" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">&lt;h1&gt;</text>

              <rect x="470" y="250" width="80" height="30" rx="6" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="510" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">&lt;p&gt;</text>

              <rect x="570" y="250" width="80" height="30" rx="6" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="610" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">&lt;button&gt;</text>
            </svg>