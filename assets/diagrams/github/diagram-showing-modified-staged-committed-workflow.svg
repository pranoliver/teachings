<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" aria-label="Diagram showing modified, staged, committed workflow" role="img"><title>Diagram showing modified, staged, committed workflow</title>
              <rect x="20" y="50" width="150" height="70" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
              <text x="95" y="80" text-anchor="middle" font-size="14" fill="#1f2328">Working</text>
              <text x="95" y="100" text-anchor="middle" font-size="12" fill="#656d76">Modified files</text>

              <line x1="170" y1="85" x2="220" y2="85" stroke="#ff7b72" stroke-width="2" marker-end="url(#github-arrow3)"/>
              <text x="195" y="75" text-anchor="middle" font-size="11" fill="#656d76">git add</text>

              <rect x="230" y="50" width="150" height="70" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
              <text x="305" y="80" text-anchor="middle" font-size="14" fill="#1f2328">Staging</text>
              <text x="305" y="100" text-anchor="middle" font-size="12" fill="#656d76">Ready to save</text>

              <line x1="380" y1="85" x2="430" y2="85" stroke="#ff7b72" stroke-width="2" marker-end="url(#github-arrow3)"/>
              <text x="405" y="75" text-anchor="middle" font-size="11" fill="#656d76">git commit</text>

              <rect x="440" y="50" width="170" height="70" rx="10" fill="#dafbe1" stroke="#3fb950" stroke-width="2"/>
              <text x="525" y="80" text-anchor="middle" font-size="14" fill="#1f2328">Repository</text>
              <text x="525" y="100" text-anchor="middle" font-size="12" fill="#656d76">Saved forever</text>

              <defs>
                <marker id="github-arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L0,6 L9,3 z" fill="#ff7b72"/>
                </marker>
              </defs>
            </svg>