<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" class="diagram" role="img" aria-label="Prometheus alerting flow"><defs><marker id="alarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e6522c"/></marker></defs><rect width="800" height="280" fill="#f6f8fa" rx="12"/><text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Prometheus Alerting Flow</text><rect x="60" y="70" width="180" height="60" rx="8" fill="#e6522c" opacity="0.2" stroke="#e6522c" stroke-width="2"/><text x="150" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Prometheus</text><line x1="240" y1="100" x2="300" y2="100" stroke="#e6522c" stroke-width="2" marker-end="url(#alarr)"/><rect x="300" y="70" width="200" height="60" rx="8" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/><text x="400" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Alertmanager</text><line x1="400" y1="130" x2="400" y2="170" stroke="#e6522c" stroke-width="2" marker-end="url(#alarr)"/><rect x="300" y="170" width="200" height="60" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/><text x="400" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Deduplicate, Group, Route</text><line x1="500" y1="200" x2="580" y2="200" stroke="#e6522c" stroke-width="2" marker-end="url(#alarr)"/><rect x="580" y="170" width="160" height="60" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/><text x="660" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Slack / PagerDuty</text><text x="400" y="260" text-anchor="middle" font-size="12" fill="#656d76">Prometheus evaluates rules; Alertmanager handles routing and notification.</text></svg>