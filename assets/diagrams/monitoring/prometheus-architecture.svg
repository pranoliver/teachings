<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" class="diagram" role="img" aria-label="Prometheus architecture">
  <defs>
    <marker id="parr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e6522c"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#f6f8fa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Prometheus Architecture</text>
  <rect x="300" y="60" width="200" height="60" rx="8" fill="#e6522c" opacity="0.2" stroke="#e6522c" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Prometheus Server</text>
  <rect x="80" y="160" width="160" height="70" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="160" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Application /metrics</text>
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="#656d76">Instrumented service</text>
  <rect x="280" y="160" width="160" height="70" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="360" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Node Exporter</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#656d76">Machine metrics</text>
  <rect x="480" y="160" width="160" height="70" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Blackbox Exporter</text>
  <text x="560" y="210" text-anchor="middle" font-size="12" fill="#656d76">Probe endpoints</text>
  <rect x="680" y="160" width="100" height="70" rx="8" fill="#ea580c" opacity="0.15" stroke="#ea580c" stroke-width="2"/>
  <text x="730" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">...</text>
  <line x1="160" y1="160" x2="360" y2="120" stroke="#e6522c" stroke-width="2" marker-end="url(#parr)"/>
  <line x1="360" y1="160" x2="400" y2="120" stroke="#e6522c" stroke-width="2" marker-end="url(#parr)"/>
  <line x1="560" y1="160" x2="440" y2="120" stroke="#e6522c" stroke-width="2" marker-end="url(#parr)"/>
  <line x1="730" y1="160" x2="460" y2="120" stroke="#e6522c" stroke-width="2" marker-end="url(#parr)"/>
  <rect x="300" y="260" width="200" height="50" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">TSDB + Alertmanager</text>
  <line x1="400" y1="120" x2="400" y2="260" stroke="#f59e0b" stroke-width="2" marker-end="url(#parr)"/>
</svg>