<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" class="diagram" role="img" aria-label="Loki architecture">
  <defs>
    <marker id="larr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="800" height="280" fill="#f6f8fa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Loki Log Aggregation Architecture</text>
  <rect x="80" y="70" width="160" height="60" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="160" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Application Logs</text>
  <line x1="240" y1="100" x2="300" y2="100" stroke="#059669" stroke-width="2" marker-end="url(#larr)"/>
  <rect x="300" y="70" width="180" height="60" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Promtail / Agent</text>
  <line x1="480" y1="100" x2="540" y2="100" stroke="#059669" stroke-width="2" marker-end="url(#larr)"/>
  <rect x="540" y="70" width="180" height="60" rx="8" fill="#e6522c" opacity="0.2" stroke="#e6522c" stroke-width="2"/>
  <text x="630" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Loki Server</text>
  <line x1="630" y1="130" x2="630" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#larr)"/>
  <rect x="540" y="170" width="180" height="60" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="630" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Object Storage</text>
  <rect x="300" y="170" width="180" height="60" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Grafana Queries</text>
  <line x1="540" y1="130" x2="420" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#larr)"/>
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#656d76">Promtail pushes labeled logs; Loki stores them cheaply in object storage.</text>
</svg>