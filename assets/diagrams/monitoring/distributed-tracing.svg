<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" class="diagram" role="img" aria-label="Distributed tracing with spans">
  <rect width="800" height="280" fill="#f6f8fa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Distributed Tracing</text>
  <rect x="80" y="70" width="120" height="40" rx="6" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">API Gateway</text>
  <rect x="240" y="70" width="120" height="40" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="300" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Auth Service</text>
  <rect x="400" y="70" width="120" height="40" rx="6" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Orders Service</text>
  <rect x="560" y="70" width="120" height="40" rx="6" fill="#ea580c" opacity="0.15" stroke="#ea580c" stroke-width="2"/>
  <text x="620" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Database</text>
  <line x1="140" y1="110" x2="300" y2="150" stroke="#656d76" stroke-width="1"/>
  <line x1="300" y1="110" x2="460" y2="150" stroke="#656d76" stroke-width="1"/>
  <line x1="460" y1="110" x2="620" y2="150" stroke="#656d76" stroke-width="1"/>
  <rect x="80" y="150" width="640" height="50" rx="6" fill="#e6522c" opacity="0.1" stroke="#e6522c" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Single trace ID carried through every service call</text>
  <text x="400" y="240" text-anchor="middle" font-size="12" fill="#656d76">Each span records duration, status, and attributes; spans nest into a trace tree.</text>
</svg>