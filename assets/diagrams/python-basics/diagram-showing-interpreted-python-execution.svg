<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" aria-label="Diagram showing interpreted Python execution" role="img"><title>Diagram showing interpreted Python execution</title>
              <rect x="30" y="45" width="140" height="70" rx="12" fill="#ffd43b" fill-opacity="0.2" stroke="#d29922" stroke-width="2"/>
              <text x="100" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#323330">Source code</text>

              <path d="M180 80 L 240 80" stroke="#d0d7de" stroke-width="2" marker-end="url(#pythonbasics-arrow)"/>
              <text x="210" y="70" text-anchor="middle" font-size="11" fill="#656d76">Interpreter</text>

              <rect x="260" y="45" width="140" height="70" rx="12" fill="#306998" fill-opacity="0.15" stroke="#306998" stroke-width="2"/>
              <text x="330" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#306998">Python</text>

              <path d="M410 80 L 470 80" stroke="#d0d7de" stroke-width="2" marker-end="url(#pythonbasics-arrow)"/>
              <text x="440" y="70" text-anchor="middle" font-size="11" fill="#656d76">runs it</text>

              <rect x="490" y="45" width="140" height="70" rx="12" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
              <text x="560" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">Output</text>

              <defs>
                <marker id="pythonbasics-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d0d7de"/></marker>
              </defs>
            </svg>