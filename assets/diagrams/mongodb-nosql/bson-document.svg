<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram of a MongoDB BSON document with embedded sub-documents and arrays</title>
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360.0" y="35" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#1f2328" >A MongoDB Document is JSON-like BSON</text>
  <text x="360.0" y="60" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="500" fill="#6b7280" >BSON adds types like ObjectId, Date, Decimal128, and binary data</text>
  <rect x="80" y="85" width="560" height="255" rx="16" fill="#e8f9ef" stroke="#13aa52" stroke-width="1.5"/>
  <text x="105" y="110" text-anchor="start" dominant-baseline="hanging" font-size="22" font-weight="700" fill="#13aa52" >{</text>
  <text x="135" y="120" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">_id: ObjectId(&quot;507f1f77bcf86cd799439011&quot;)</text>
  <text x="135" y="140" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">user: &quot;alex_m&quot;</text>
  <text x="135" y="160" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">createdAt: ISODate(&quot;2024-06-01T10:00:00Z&quot;)</text>
  <text x="135" y="180" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">cart: [</text>
  <text x="159" y="200" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">{ product: &quot;Air Fryer&quot;, price: 89 },</text>
  <text x="159" y="220" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">{ product: &quot;Rice Cooker&quot;, price: 45 }</text>
  <text x="135" y="240" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">]</text>
  <text x="135" y="260" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">shipping: {</text>
  <text x="159" y="280" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">city: &quot;Mumbai&quot;,</text>
  <text x="159" y="300" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">pin: &quot;400001&quot;</text>
  <text x="135" y="320" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">}</text>
  <text x="135" y="340" text-anchor="start" dominant-baseline="hanging" font-size="13" font-weight="500" fill="#1f2328" font-family="ui-monospace, monospace">tags: [&quot;electronics&quot;, &quot;kitchen&quot;]</text>
  <text x="105" y="330" text-anchor="start" dominant-baseline="hanging" font-size="22" font-weight="700" fill="#13aa52" >}</text>
  <rect x="480" y="295" width="130" height="35" rx="8" fill="#ffffff" stroke="#13aa52" stroke-width="1.5"/>
  <text x="545" y="312" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#13aa52" >BSON = binary JSON</text>
</svg>
