<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" class="diagram" role="img" aria-label="Terraform state flow diagram">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b42bc" />
    </marker>
  </defs>
  <rect width="800" height="280" fill="#f6f8fa" rx="12" />
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">State Flow</text>
  <rect x="60" y="70" width="160" height="80" rx="8" fill="#7b42bc" opacity="0.15" stroke="#7b42bc" stroke-width="2" />
  <text x="140" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Terraform CLI</text>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#656d76">plan / apply</text>
  <line x1="220" y1="110" x2="300" y2="110" stroke="#7b42bc" stroke-width="2" marker-end="url(#a)" />
  <rect x="310" y="70" width="180" height="80" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2" />
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">State file</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#656d76">maps resources to IDs</text>
  <line x1="400" y1="150" x2="400" y2="190" stroke="#7b42bc" stroke-width="2" marker-end="url(#a)" />
  <rect x="310" y="195" width="180" height="70" rx="8" fill="#ea580c" opacity="0.15" stroke="#ea580c" stroke-width="2" />
  <text x="400" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Remote backend</text>
  <line x1="490" y1="110" x2="620" y2="110" stroke="#7b42bc" stroke-width="2" marker-end="url(#a)" />
  <rect x="630" y="70" width="140" height="80" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2" />
  <text x="700" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Cloud APIs</text>
  <text x="700" y="130" text-anchor="middle" font-size="12" fill="#656d76">AWS / Azure / GCP</text>
  <text x="400" y="270" text-anchor="middle" font-size="12" fill="#656d76">Terraform uses state to know what was already created before calling cloud APIs again.</text>
</svg>
