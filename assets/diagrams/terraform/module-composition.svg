<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" class="diagram" role="img" aria-label="Terraform module composition diagram">
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b42bc" />
    </marker>
  </defs>
  <rect width="800" height="300" fill="#f6f8fa" rx="12" />
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Module Composition</text>
  <rect x="300" y="50" width="200" height="60" rx="8" fill="#7b42bc" opacity="0.2" stroke="#7b42bc" stroke-width="2" />
  <text x="400" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">root module</text>
  <line x1="400" y1="110" x2="400" y2="150" stroke="#7b42bc" stroke-width="2" marker-end="url(#m)" />
  <rect x="60" y="160" width="160" height="70" rx="8" fill="#0369a1" opacity="0.15" stroke="#0369a1" stroke-width="2" />
  <text x="140" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">network</text>
  <text x="140" y="210" text-anchor="middle" font-size="12" fill="#656d76">VPC, subnets, IGW</text>
  <rect x="260" y="160" width="160" height="70" rx="8" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2" />
  <text x="340" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">compute</text>
  <text x="340" y="210" text-anchor="middle" font-size="12" fill="#656d76">ALB, ASG, EC2</text>
  <rect x="460" y="160" width="160" height="70" rx="8" fill="#ea580c" opacity="0.15" stroke="#ea580c" stroke-width="2" />
  <text x="540" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">database</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" fill="#656d76">RDS subnet group</text>
  <rect x="660" y="160" width="120" height="70" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2" />
  <text x="720" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">storage</text>
  <text x="720" y="210" text-anchor="middle" font-size="12" fill="#656d76">S3 bucket</text>
  <line x1="400" y1="160" x2="150" y2="160" stroke="#7b42bc" stroke-width="2" marker-end="url(#m)" />
  <line x1="400" y1="160" x2="340" y2="160" stroke="#7b42bc" stroke-width="2" marker-end="url(#m)" />
  <line x1="400" y1="160" x2="540" y2="160" stroke="#7b42bc" stroke-width="2" marker-end="url(#m)" />
  <line x1="400" y1="160" x2="720" y2="160" stroke="#7b42bc" stroke-width="2" marker-end="url(#m)" />
  <text x="400" y="285" text-anchor="middle" font-size="12" fill="#656d76">The root module calls child modules and wires their outputs together.</text>
</svg>
