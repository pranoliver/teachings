<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram comparing a slow query scanning millions of rows with a fast query using a covering index</title>
  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Adding the Right Index</text>  <rect x="80" y="70" width="240" height="120" rx="10" fill="#fdecec" stroke="#cf222e" stroke-width="1.5"/>
  <text x="200.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#cf222e">Before Index</text>  <text x="200" y="110" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#1f2328">SELECT status FROM orders
WHERE created_at &gt; NOW() - 7 days</text>  <text x="200" y="155" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#cf222e">Seq Scan: 50M rows</text>  <text x="200" y="180" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="800" fill="#cf222e">⏱ 8.2 seconds</text>    <marker id="arr-41874" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#d0d7de"/>
    </marker>
  <line x1="330" y1="130" x2="400" y2="130" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arr-41874)" stroke-linecap="round"/>
  <text x="365.0" y="120.0" text-anchor="middle" font-size="10" fill="#848d97">CREATE INDEX</text>  <rect x="420" y="70" width="240" height="120" rx="10" fill="#e8f9ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="540.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1a7f37">After Index</text>  <text x="540" y="110" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500" fill="#1f2328">CREATE INDEX idx_created_status
ON orders(created_at) INCLUDE (status)</text>  <text x="540" y="155" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#1a7f37">Index Only Scan: 12k rows</text>  <text x="540" y="180" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="800" fill="#1a7f37">⏱ 12 ms</text>  <text x="360" y="235" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#1a7f37">index-only scans avoid touching the heap when all columns are in the index</text></svg>
