<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" style="font-family: Outfit, system-ui, -apple-system, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;" preserveAspectRatio="xMidYMid meet">
  <title>Diagram of a PostgreSQL EXPLAIN plan tree with cost, rows, and width annotations</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1f2328">Reading an EXPLAIN Plan</text>  <rect x="300" y="60" width="180" height="45" rx="10" fill="#fdf8ec" stroke="#9a6700" stroke-width="1.5"/>
  <text x="390.0" y="82.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#9a6700">Sort</text>
  <text x="390.0" y="98.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">cost=123..145 rows=1200 width=80</text>  <rect x="300" y="130" width="180" height="45" rx="10" fill="#e8eefb" stroke="#486bb3" stroke-width="1.5"/>
  <text x="390.0" y="152.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#486bb3">Hash Join</text>
  <text x="390.0" y="168.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">cost=45..120 rows=1200 width=80</text>  <rect x="120" y="210" width="160" height="45" rx="10" fill="#fdecec" stroke="#cf222e" stroke-width="1.5"/>
  <text x="200.0" y="232.5" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#cf222e">Seq Scan on orders</text>
  <text x="200.0" y="248.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">cost=0..25 rows=1000 width=40</text>  <rect x="360" y="210" width="180" height="45" rx="10" fill="#e8f9ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="450.0" y="232.5" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#1a7f37">Index Scan on customers</text>
  <text x="450.0" y="248.5" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#656d76">cost=0..15 rows=300 width=40</text>  <line x1="390" y1="105" x2="390" y2="130" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="390" y1="175" x2="200" y2="210" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="390" y1="175" x2="450" y2="210" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="290" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#848d97">bottom = data sources</text>  <text x="540" y="290" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="500" fill="#848d97">top = final output node</text>  <rect x="80" y="320" width="560" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>  <text x="360" y="335" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#1f2328">cost = estimated work units; rows = estimated rows; width = bytes per row</text></svg>
