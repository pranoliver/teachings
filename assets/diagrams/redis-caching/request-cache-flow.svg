<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Diagram showing client request, Redis cache hit, and database fallback"><title>Diagram showing client request, Redis cache hit, and database fallback</title>
  <defs>
    <marker id="rediscaching-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#656d76"/>
    </marker>
    <marker id="rediscaching-arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#848d97"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="20" y="30" width="100" height="80" rx="10" fill="#d82c20" fill-opacity="0.15" stroke="#d82c20" stroke-width="2"/>
  <text x="70" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#d82c20" font-family="Outfit, system-ui, sans-serif">Client</text>
  <text x="70" y="82" text-anchor="middle" font-size="10" fill="#656d76" font-family="Outfit, system-ui, sans-serif">GET /products</text>

  <!-- Client to Redis -->
  <path d="M120 70 L 240 70" stroke="#656d76" stroke-width="2" marker-end="url(#rediscaching-arrow)"/>

  <!-- Redis -->
  <rect x="260" y="30" width="120" height="80" rx="10" fill="#d82c20" fill-opacity="0.15" stroke="#d82c20" stroke-width="2"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#d82c20" font-family="Outfit, system-ui, sans-serif">Redis</text>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Cache hit</text>

  <!-- Redis to Database (dashed, on miss) -->
  <path d="M380 70 L 420 70" stroke="#848d97" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rediscaching-arrow-dashed)"/>
  <text x="400" y="55" text-anchor="middle" font-size="9" fill="#848d97" font-family="Outfit, system-ui, sans-serif">if miss</text>

  <!-- Database -->
  <rect x="420" y="30" width="120" height="80" rx="10" fill="#d0d7de" fill-opacity="0.2" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Database</text>
  <text x="480" y="82" text-anchor="middle" font-size="10" fill="#656d76" font-family="Outfit, system-ui, sans-serif">On miss</text>

  <!-- Optional: Redis response back to client -->
  <path d="M320 110 L 320 130 L 70 130 L 70 115" stroke="#656d76" stroke-width="1.5" fill="none" marker-end="url(#rediscaching-arrow)"/>
  <text x="195" y="126" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">cached response</text>
</svg>
