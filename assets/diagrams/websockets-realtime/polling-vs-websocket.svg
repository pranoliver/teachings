<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img">
  <title>Diagram comparing HTTP polling requests to a persistent WebSocket connection</title>
  <defs>
    <marker id="ws-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#656d76"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="180" fill="#ffffff"/>

  <!-- HTTP Polling side -->
  <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="Outfit, system-ui, sans-serif">HTTP polling</text>

  <rect x="40" y="45" width="100" height="55" rx="8" fill="#d0d7de" fill-opacity="0.3" stroke="#d0d7de" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Client</text>
  <text x="90" y="88" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">polling loop</text>

  <rect x="240" y="45" width="100" height="55" rx="8" fill="#d0d7de" fill-opacity="0.3" stroke="#d0d7de" stroke-width="2"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Server</text>
  <text x="290" y="88" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">answers every call</text>

  <path d="M140 65 L 230 65" stroke="#656d76" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <path d="M230 85 L 140 85" stroke="#656d76" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <path d="M140 105 L 230 105" stroke="#656d76" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <path d="M230 125 L 140 125" stroke="#656d76" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <text x="185" y="140" text-anchor="middle" font-size="9" fill="#848d97" font-family="Outfit, system-ui, sans-serif">many requests, even when idle</text>

  <!-- Divider -->
  <line x1="360" y1="20" x2="360" y2="160" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- WebSocket side -->
  <text x="540" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="Outfit, system-ui, sans-serif">WebSocket</text>

  <rect x="400" y="45" width="100" height="55" rx="8" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Client</text>
  <text x="450" y="88" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">open connection</text>

  <rect x="580" y="45" width="100" height="55" rx="8" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="630" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Server</text>
  <text x="630" y="88" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">pushes updates</text>

  <line x1="500" y1="70" x2="580" y2="70" stroke="#010101" stroke-width="2"/>
  <path d="M530 60 L 540 55" stroke="#010101" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <path d="M550 80 L 540 85" stroke="#010101" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <path d="M570 60 L 580 55" stroke="#010101" stroke-width="1.5" marker-end="url(#ws-arrow)"/>
  <text x="540" y="140" text-anchor="middle" font-size="9" fill="#848d97" font-family="Outfit, system-ui, sans-serif">one persistent, full-duplex link</text>
</svg>
