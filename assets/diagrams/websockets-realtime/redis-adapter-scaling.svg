<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img">
  <title>Diagram showing multiple Socket.io servers sharing state through a Redis adapter</title>
  <defs>
    <marker id="scale-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#656d76"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="200" fill="#ffffff"/>

  <!-- Load balancer -->
  <rect x="300" y="20" width="120" height="45" rx="8" fill="#d0d7de" fill-opacity="0.3" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Load Balancer</text>
  <text x="360" y="56" text-anchor="middle" font-size="9" fill="#848d97" font-family="Outfit, system-ui, sans-serif">websocket-aware</text>

  <!-- Servers -->
  <rect x="80" y="95" width="120" height="60" rx="10" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Server 1</text>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Socket.io</text>

  <rect x="300" y="95" width="120" height="60" rx="10" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Server 2</text>
  <text x="360" y="138" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Socket.io</text>

  <rect x="520" y="95" width="120" height="60" rx="10" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="580" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Server 3</text>
  <text x="580" y="138" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">Socket.io</text>

  <!-- Redis -->
  <rect x="300" y="170" width="120" height="50" rx="10" fill="#d82c20" fill-opacity="0.1" stroke="#d82c20" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#d82c20" font-family="Outfit, system-ui, sans-serif">Redis Adapter</text>

  <!-- Arrows down from LB -->
  <path d="M340 65 L 140 95" stroke="#656d76" stroke-width="2" marker-end="url(#scale-arrow)"/>
  <path d="M360 65 L 360 95" stroke="#656d76" stroke-width="2" marker-end="url(#scale-arrow)"/>
  <path d="M380 65 L 580 95" stroke="#656d76" stroke-width="2" marker-end="url(#scale-arrow)"/>

  <!-- Arrows to Redis -->
  <path d="M140 155 L 340 180" stroke="#d82c20" stroke-width="2" marker-end="url(#scale-arrow)"/>
  <path d="M360 155 L 360 170" stroke="#d82c20" stroke-width="2" marker-end="url(#scale-arrow)"/>
  <path d="M580 155 L 380 180" stroke="#d82c20" stroke-width="2" marker-end="url(#scale-arrow)"/>

  <text x="360" y="150" text-anchor="middle" font-size="9" fill="#848d97" font-family="Outfit, system-ui, sans-serif">pub/sub sync across all nodes</text>
</svg>
