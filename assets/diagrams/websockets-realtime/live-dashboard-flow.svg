<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img">
  <title>Diagram showing data sources feeding a server that pushes live metrics to dashboards</title>
  <defs>
    <marker id="dash-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#656d76"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="180" fill="#ffffff"/>

  <!-- Data sources -->
  <rect x="30" y="30" width="100" height="55" rx="8" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="2"/>
  <text x="80" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#059669" font-family="Outfit, system-ui, sans-serif">Orders DB</text>
  <text x="80" y="72" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">transactions</text>

  <rect x="30" y="100" width="100" height="55" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-width="2"/>
  <text x="80" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#ea580c" font-family="Outfit, system-ui, sans-serif">App Servers</text>
  <text x="80" y="142" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">CPU / health</text>

  <!-- Server -->
  <rect x="250" y="50" width="140" height="80" rx="10" fill="#010101" fill-opacity="0.08" stroke="#010101" stroke-width="2"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#010101" font-family="Outfit, system-ui, sans-serif">Socket.io Server</text>
  <text x="320" y="100" text-anchor="middle" font-size="10" fill="#656d76" font-family="Outfit, system-ui, sans-serif">aggregates + pushes</text>

  <!-- Dashboards -->
  <rect x="460" y="30" width="110" height="55" rx="8" fill="#2f81f7" fill-opacity="0.1" stroke="#2f81f7" stroke-width="2"/>
  <text x="515" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#2f81f7" font-family="Outfit, system-ui, sans-serif">Dashboard A</text>
  <text x="515" y="72" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">sales view</text>

  <rect x="460" y="100" width="110" height="55" rx="8" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2"/>
  <text x="515" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed" font-family="Outfit, system-ui, sans-serif">Dashboard B</text>
  <text x="515" y="142" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">ops view</text>

  <rect x="600" y="65" width="100" height="50" rx="8" fill="#d82c20" fill-opacity="0.1" stroke="#d82c20" stroke-width="2"/>
  <text x="650" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#d82c20" font-family="Outfit, system-ui, sans-serif">Alerts</text>
  <text x="650" y="104" text-anchor="middle" font-size="9" fill="#656d76" font-family="Outfit, system-ui, sans-serif">thresholds</text>

  <!-- Arrows -->
  <path d="M130 55 L 250 85" stroke="#059669" stroke-width="2" marker-end="url(#dash-arrow)"/>
  <path d="M130 125 L 250 95" stroke="#ea580c" stroke-width="2" marker-end="url(#dash-arrow)"/>
  <path d="M390 75 L 460 55" stroke="#2f81f7" stroke-width="2" marker-end="url(#dash-arrow)"/>
  <path d="M390 100 L 460 125" stroke="#7c3aed" stroke-width="2" marker-end="url(#dash-arrow)"/>
  <path d="M390 90 L 600 90" stroke="#d82c20" stroke-width="2" marker-end="url(#dash-arrow)"/>

  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#848d97" font-family="Outfit, system-ui, sans-serif">updates pushed instantly; dashboards never need to refresh</text>
</svg>
